[mypy]
python_version = 3.12
mypy_path = typings
files =
    app/token_utils.py,
    app/mutation_validation_utils.py,
    app/tasks.py
follow_imports = silent
check_untyped_defs = True
disallow_any_generics = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
strict_equality = True
warn_redundant_casts = True
warn_return_any = True
warn_unreachable = True
warn_unused_configs = True
warn_unused_ignores = True
show_error_codes = True
pretty = True

# The first baseline intentionally checks only the listed stable boundaries.
# Each later typing PR must add its modules to `files`; legacy modules are not
# declared clean by this configuration.
