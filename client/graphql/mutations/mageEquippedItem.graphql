mutation mageEquippedItem(
  $stats: [CustomSetExosInput!]!
  $equippedItemId: UUID!
  $weaponElementMage: WeaponElementMage
  $weaponHealingMage: WeaponElementMage
) {
  mageEquippedItem(
    equippedItemId: $equippedItemId
    stats: $stats
    weaponElementMage: $weaponElementMage
    weaponHealingMage: $weaponHealingMage
  ) {
    equippedItem {
      id
      exos {
        id
        stat
        value
      }
      weaponElementMage
      weaponHealingMage
    }
  }
}
