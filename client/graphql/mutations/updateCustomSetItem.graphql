#import "graphql/fragments/item.graphql"

mutation updateCustomSetItem(
  $itemSlotId: UUID!
  $customSetId: UUID
  $itemId: UUID
) {
  updateCustomSetItem(
    itemSlotId: $itemSlotId
    customSetId: $customSetId
    itemId: $itemId
  ) {
    customSet {
      id
      equippedItems {
        id
        weaponElementMage
        weaponHealingMage
        slot {
          id
          name
          order
        }
        item {
          ...item
        }
        exos {
          id
          stat
          value
        }
        weaponElementMage
      }
    }
  }
}
