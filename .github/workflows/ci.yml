name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client type and equipment checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: client/yarn.lock

      - name: Install client dependencies
        run: yarn install --frozen-lockfile

      - name: Type-check client
        run: yarn type-check

      - name: Run equipment regression checks
        run: yarn ts-node --project tsconfig.server.json scripts/test_3_7_equipment.ts

  committed-data:
    name: Committed data integrity
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install test runner
        run: python -m pip install pytest==7.4.4

      - name: Validate committed game data
        run: python -m pytest server/tests/test_committed_data.py

  backend:
    name: Backend regression
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:14.1
        env:
          POSTGRES_DB: dofuslab
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dofuslab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AWS_ACCESS_KEY_ID: ci-placeholder
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_SECRET_ACCESS_KEY: ci-placeholder
      DATABASE_URL: postgresql+psycopg2://postgres:password@localhost:5432/dofuslab
      DD_TRACE_ENABLED: 'false'
      FLASK_APP: app
      FLASK_ENV: development
      HOME_PAGE: http://localhost:3000/
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-only-secret
      SES_EMAIL_SOURCE: ci@example.invalid
      SES_REGION: us-east-1
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.8'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install system dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          gcc gfortran libblis-dev libffi-dev liblapack-dev libopenblas-dev
          libpq-dev postgresql-client

      - name: Install backend dependencies
        run: |
          python -m pip install pip==23.0.1
          python -m pip install --requirement requirements.txt

      - name: Prepare disposable database
        run: |
          PGPASSWORD=password psql --host localhost --username postgres --dbname dofuslab \
            --command 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
          flask db upgrade
          printf 'y\n' | python -m oneoff.database_setup

      - name: Run backend regression tests
        run: python -m pytest tests
